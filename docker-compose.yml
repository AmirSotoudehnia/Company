services:
  agent-company:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - agent_data:/data

# Security note: do not mount /var/run/docker.sock into this control-plane
# container. For the current MVP, run the control plane on a trusted Docker
# host when EXECUTION_MODE=docker. Production will use a separate worker queue.

volumes:
  agent_data:
