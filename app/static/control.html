<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Company Control</title><style>
body{font-family:system-ui;margin:0;background:#0b1020;color:#e8ecf5}.wrap{max-width:1400px;margin:auto;padding:24px}
h1{margin:0}.muted{color:#8d99ae}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin:20px 0}
.card,.panel{background:#151c31;border:1px solid #26314e;border-radius:14px;padding:16px}.agent{display:flex;justify-content:space-between;gap:12px}
.status{font-size:12px;padding:4px 8px;border-radius:999px;background:#293450}.running{background:#14532d}.failed,.blocked{background:#7f1d1d}.completed{background:#164e63}.paused{background:#78350f}
button{background:#334155;color:white;border:0;border-radius:8px;padding:7px 10px;cursor:pointer}select,input{background:#0b1020;color:#e8ecf5;border:1px solid #394867;border-radius:8px;padding:9px;margin:0 8px 8px 0;min-width:260px}input[type=number]{min-width:70px;width:70px}button:disabled{opacity:.55;cursor:wait}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #26314e;font-size:13px}
.cols{display:grid;grid-template-columns:2fr 1fr;gap:14px}@media(max-width:800px){.cols{grid-template-columns:1fr}}</style></head><body><div class="wrap">
<h1>Agent Company — Live Control</h1><div class="muted" id="stamp">Connecting…</div>
<div class="panel" style="margin-top:18px"><h2>Find work</h2><form id="searchForm"><select id="searchMode"><option value="job_ads">Job advertisements</option><option value="local_businesses_without_website">Local businesses missing a website</option></select><input id="searchQuery" required minlength="2" maxlength="200" placeholder="Job title or city"><input id="searchLimit" type="number" min="1" max="100" value="25"><button id="searchButton" type="submit">Save & start search</button></form><p class="muted" id="searchHint">Choose a source, enter a job title or city, then start.</p><p class="muted" id="searchResult"></p></div><div class="grid" id="agents"></div>
<div class="cols"><div class="panel"><h2>Jobs</h2><div id="jobs"></div></div><div class="panel"><h2>Pending approvals</h2><div id="approvals"></div><h2>Incidents</h2><div id="incidents"></div></div></div>
<div class="panel" style="margin-top:14px"><h2>Search activity</h2><div id="searchRuns"></div></div>
<div class="panel" style="margin-top:14px"><h2>Opportunity results</h2><div id="opportunities"></div></div>
<div class="panel" style="margin-top:14px"><h2>Gmail draft outbox</h2><div id="outbox"></div></div>
<div class="panel" style="margin-top:14px"><h2>Invoice drafts</h2><div id="invoices"></div></div>
<div class="panel" style="margin-top:14px"><h2>Projects</h2><div id="projects"></div></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const table=(rows,cols)=>rows.length?'<table><tr>'+cols.map(c=>'<th>'+esc(c[0])+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+esc(r[c[1]])+'</td>').join('')+'</tr>').join('')+'</table>':'<span class="muted">None</span>';
async function toggle(name,paused){await fetch('/control/agents/'+encodeURIComponent(name)+'/'+(paused?'resume':'pause'),{method:'POST'});load()}
async function job(id,action){await fetch('/control/jobs/'+id+'/'+action,{method:'POST'});load()}
const decisionBody=approved=>({method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({approved,note:'Reviewed in local control panel'})});
async function outboxDecision(id,approved){await fetch('/control/outbox/'+id+'/decision',decisionBody(approved));load()}
async function approvalDecision(a,approved){const roots={project:'projects',sales:'opportunities',engagement:'engagements'};const tails={project:'approve',sales:'approve',engagement:'scope-approval'};await fetch('/'+roots[a.category]+'/'+a.project_id+'/'+tails[a.category]+'/'+a.id,decisionBody(approved));load()}
async function invoiceDecision(id,approved){await fetch('/billing/invoices/'+id+'/decision',decisionBody(approved));load()}
searchMode.onchange=()=>{const local=searchMode.value==='local_businesses_without_website';searchQuery.placeholder=local?'City, e.g. Växjö':'Job title, e.g. Flutter developer';searchHint.textContent=local?'Finds public map records without a website tag; verify before contact.':'Searches official JobTech job advertisements.'};
searchForm.onsubmit=async e=>{e.preventDefault();searchButton.disabled=true;searchResult.textContent='Searching…';try{const r=await fetch('/control/search/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:searchQuery.value,limit:Number(searchLimit.value),mode:searchMode.value})});const d=await r.json();if(!r.ok)throw new Error(d.detail||'Search failed');searchResult.textContent=`Done: ${d.found} found, ${d.new} new opportunities saved.`;load()}catch(err){searchResult.textContent='Error: '+err.message}finally{searchButton.disabled=false}};
async function load(){try{const [d,c]=await Promise.all([fetch('/control/snapshot').then(r=>r.json()),fetch('/control/search').then(r=>r.json())]);stamp.textContent='Live • '+new Date(d.generated_at).toLocaleString();if(document.activeElement!==searchQuery){searchMode.value=c.mode;searchQuery.value=c.query;searchLimit.value=c.limit;searchMode.onchange();}
const latest=d.search_runs[0];if(latest&&searchButton.disabled===false){searchResult.textContent=latest.status==='running'?'Search is running…':latest.status==='completed'?`Last search completed: ${latest.found} found, ${latest.new_count} new.`:`Last search failed: ${latest.error}`;}
searchRuns.innerHTML=table(d.search_runs,[['ID','id'],['Mode','mode'],['Query','query'],['Status','status'],['Found','found'],['New','new_count'],['Started','started_at']]);
opportunities.innerHTML=d.opportunities.length?'<table><tr><th>Name</th><th>Source</th><th>Score</th><th>Status</th><th>Link</th></tr>'+d.opportunities.map(o=>`<tr><td>${esc(o.title)}</td><td>${esc(o.source)}</td><td>${esc(o.score)}</td><td>${esc(o.status)}</td><td>${o.source_url?`<a href="${esc(o.source_url)}" target="_blank" rel="noopener">Open source</a>`:'-'}</td></tr>`).join('')+'</table>':'<span class="muted">No results yet</span>';
agents.innerHTML=d.agents.map(a=>`<div class="card"><div class="agent"><b>${esc(a.agent)}</b><span class="status ${esc(a.status)}">${esc(a.status)}</span></div><p>${esc(a.detail)||'<span class="muted">No current task</span>'}</p><small class="muted">Project ${esc(a.project_id??'-')} • Job ${esc(a.job_id??'-')}</small><br><br><button onclick="toggle('${esc(a.agent)}',${a.paused})">${a.paused?'Resume':'Pause'}</button></div>`).join('');
jobs.innerHTML=d.jobs.length?'<table><tr><th>ID</th><th>Kind</th><th>Status</th><th>Worker</th><th>Action</th></tr>'+d.jobs.map(j=>`<tr><td>${j.id}</td><td>${esc(j.kind)}</td><td>${esc(j.status)}</td><td>${esc(j.locked_by||'-')}</td><td>${j.status==='failed'||j.status==='cancelled'?`<button onclick="job(${j.id},'retry')">Retry</button>`:''} ${j.status==='queued'||j.status==='running'?`<button onclick="job(${j.id},'cancel')">Cancel</button>`:''}</td></tr>`).join('')+'</table>':'<span class="muted">None</span>';
approvals.innerHTML=d.pending_approvals.length?'<table><tr><th>Kind</th><th>Decision</th></tr>'+d.pending_approvals.map(a=>`<tr><td>${esc(a.category)} / ${esc(a.kind)}</td><td><button onclick='approvalDecision(${JSON.stringify(a)},true)'>Approve</button> <button onclick='approvalDecision(${JSON.stringify(a)},false)'>Reject</button></td></tr>`).join('')+'</table>':'<span class="muted">None</span>';
outbox.innerHTML=d.outbox.length?'<table><tr><th>ID</th><th>Opportunity</th><th>Provider</th><th>Decision</th></tr>'+d.outbox.map(o=>`<tr><td>${o.id}</td><td>${o.opportunity_id}</td><td>${esc(o.provider)}</td><td><button onclick="outboxDecision(${o.id},true)">Approve Gmail draft</button> <button onclick="outboxDecision(${o.id},false)">Reject</button></td></tr>`).join('')+'</table>':'<span class="muted">None</span>';
invoices.innerHTML=d.invoices.length?'<table><tr><th>Number</th><th>Amount</th><th>Status</th><th>Decision</th></tr>'+d.invoices.map(i=>`<tr><td>${esc(i.number)}</td><td>${esc(i.amount)} ${esc(i.currency)}</td><td>${esc(i.status)}</td><td>${i.status==='draft'?`<button onclick="invoiceDecision(${i.id},true)">Approve draft</button> <button onclick="invoiceDecision(${i.id},false)">Reject</button>`:'-'}</td></tr>`).join('')+'</table>':'<span class="muted">None</span>';
incidents.innerHTML=table(d.incidents,[['Severity','severity'],['Title','title'],['Status','status']]);projects.innerHTML=table(d.projects,[['ID','id'],['Project','name'],['Status','status'],['Created','created_at']]);
}catch(e){stamp.textContent='Disconnected • '+e} }
load();setInterval(load,2000);
</script></div></body></html>
